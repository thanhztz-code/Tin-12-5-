<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn luyện Tin học 12 - Giữa kì 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#18181b;--cd:#27272a;--ln:#3f3f46;--tx:#f4f4f5;--mu:#a1a1aa;--or:#ff9f1c;--ob:#4f3e2b;--ok:#22c55e;--bd:#ef4444}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 50px}
body.inquiz{padding-bottom:120px}
#app{max-width:780px;margin:0 auto;padding:10px 12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mu{color:var(--mu)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tab{flex:1 0 auto;padding:12px 14px;border:1px solid var(--ln);border-radius:16px;background:var(--cd);font-weight:600;white-space:nowrap}
.on{border-color:var(--or)!important;background:var(--ob)!important;color:var(--or)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:20px}
.card h2 small{font-size:13px;color:var(--mu);font-weight:600}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mb{padding:14px 8px;border:1px solid var(--ln);border-radius:16px;background:var(--bg);text-align:center}
.mb small{display:block;color:var(--mu)}
.chk{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--ln);border-radius:16px;background:var(--bg);margin-bottom:10px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--or);flex:none}
.chk .cn{margin-left:auto;color:var(--mu);white-space:nowrap;font-size:14px}
.start,.resume{width:100%;padding:18px;border:0;border-radius:20px;background:var(--or);color:#1c1917;font-size:19px;font-weight:800;margin-bottom:14px}
.resume{background:#16a34a;color:#fff;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(34,197,94,.25)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip,.sm{padding:10px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);font-size:15px}
.sm.dg{color:var(--bd)}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qs{flex:1;font-weight:700;font-size:17px}
.tmr{color:var(--or);font-weight:700;font-variant-numeric:tabular-nums}
.ib{min-width:44px;height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font-size:18px}
.sec{color:var(--or);font-weight:700;font-size:14px;margin-bottom:4px}
.qh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qh h3{margin:0;font-size:22px}
.fb{padding:6px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);font-size:13px;margin-left:6px}
.qt{white-space:pre-wrap;word-break:break-word;font-size:18px;margin:12px 0 6px}
.qi{max-width:100%;border-radius:12px;margin:8px 0}
.hint{color:var(--mu);font-style:italic;margin:6px 0 12px;font-size:15px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--ln);border-radius:16px;margin-bottom:10px;background:var(--bg);cursor:pointer;min-height:56px}
.ltr{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.sel{border-color:var(--or);background:var(--ob)}
.opt.sel .ltr{background:var(--or);border-color:var(--or);color:#1c1917}
.opt.ok{border-color:var(--ok);background:#14341f}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#052e12}
.opt.bad{border-color:var(--bd);background:#3b1616}
.opt.bad .ltr{background:var(--bd);border-color:var(--bd)}
.opt.cut .ot{text-decoration:line-through;opacity:.4}
.ot{flex:1;white-space:pre-wrap;word-break:break-word}
.x{flex:none;background:none;border:0;color:var(--mu);font-size:16px;padding:8px}
.st{border:2px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--bg)}
.st.ok{border-color:var(--ok)}
.st.bad{border-color:var(--bd)}
.stt{white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.tfb{display:flex;gap:10px}
.tb{flex:1;padding:12px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);font-weight:700}
.tb.on{border-color:var(--or);background:var(--ob);color:var(--or)}
.rs{margin-top:8px;font-size:14px;font-weight:600}
.show .tb,.show .opt{pointer-events:none}
.sa{width:100%;padding:16px;font-size:24px;text-align:center;border-radius:16px;border:2px solid var(--ln);background:var(--bg);margin:10px 0}
.ex{border-left:4px solid var(--or);background:var(--bg);padding:10px 12px;border-radius:10px;margin-top:12px;white-space:pre-wrap}
.note{margin-top:12px}
.note textarea{width:100%;padding:10px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cd);border-top:1px solid var(--ln);padding:10px 12px calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px}
.bl{display:flex;align-items:center;gap:8px;font-weight:700}
.main{padding:14px 22px;border:0;border-radius:16px;background:var(--or);color:#1c1917;font-weight:800;font-size:17px;min-width:150px}
.main:disabled{opacity:.4}
.main.good{background:var(--ok)}
.main.retry{background:#3b82f6;color:#fff}
.pal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.pal>div{background:var(--cd);border-radius:20px;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:12px 0}
.pg button{height:46px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.pg button.dn{background:var(--ob);border-color:var(--or)}
.pg button.cu{outline:2px solid #fff}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:92%;padding:12px 18px;border-radius:16px;background:#3f3f46;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s;text-align:center}
#toast.show{opacity:1}
#toast.ok{background:#15803d}
#toast.bad{background:#b91c1c}
#nht{position:fixed;right:12px;bottom:calc(2px + env(safe-area-inset-bottom));z-index:60;font-weight:900;font-size:17px;color:var(--or);letter-spacing:2px;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);margin-bottom:8px}
.row .g{flex:1;min-width:0}
.row .g small{display:block;color:var(--mu)}
.big{font-size:44px;font-weight:900;color:var(--or);text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.pill.ok{background:#14532d;color:#86efac}
.pill.bad{background:#7f1d1d;color:#fca5a5}
#padw{display:none;position:fixed;inset:0;z-index:40}
#pad{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#padt{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:6px;background:var(--cd);border:1px solid var(--ln);padding:6px;border-radius:14px}
#padt button{width:40px;height:40px;border-radius:10px;border:2px solid var(--ln);background:var(--bg)}
.crash{position:fixed;inset:0;z-index:99;background:#18181b;padding:20px;overflow:auto}
.crash pre{white-space:pre-wrap;color:#fca5a5}
.crash button{padding:14px 20px;border:0;border-radius:14px;background:var(--or);font-weight:800}
.lbr{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--ln)}
.lbr .rk{width:34px;text-align:center;font-weight:800;color:var(--or)}
.lbr .g{flex:1;min-width:0}
.lbr .g small{display:block;color:var(--mu)}
.lbr .sc{font-weight:800;text-align:right}
@media(max-width:480px){.main{min-width:130px;padding:14px 14px}.qt{font-size:17px}}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>
<div id="nht">NHT</div>

nếu địa chỉ đích không có trong bảng hướng dẫn, router sẽ làm gì?", "image": "", "options": ["Tự động tính toán tuyến đường mới.", "Gửi trả lại gói dữ liệu cho máy phát.", "Chuyển gói dữ liệu sang cổng mặc định.", "Hủy bỏ gói dữ liệu ngay lập tức."], "correct": 2, "explanation": ""}, {"id": 116, "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "lesson": "Đề 5", "type": "single", "question": "Trước khi đăng bài hoặc chia sẻ thông tin lên mạng xã hội, người dùng cần làm gì để tránh làm tổn hại danh tiếng người khác?", "image": "", "options": ["Gắn thẻ (tag) thật nhiều người vào bài viết.", "Cài đặt chế độ chia sẻ ẩn danh.", "Đọc kĩ nội dung và kiểm tra tính chính xác của nó.", "Chỉnh sửa hình ảnh cho bắt mắt hơn."], "correct": 2, "explanation": ""}, {"id": 117, "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "lesson": "Đề 5", "type": "single", "question": "AI được sử dụng trong các trang trại thông minh nhằm theo dõi trực tiếp yếu tố nào?", "image": "", "options": ["Sức đề kháng với dịch bệnh và thời tiết của vật nuôi, cây trồng.", "Tiến độ học tập của từng học sinh.", "Biến động cổ phiếu trên thị trường chứng khoán.", "Chi phí sản xuất phương tiện giao thông."], "correct": 0, "explanation": ""}, {"id": 118, "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "lesson": "Đề 5", "type": "single", "question": "Để máy tính để bàn có thể kết nối Wi-Fi khi không được trang bị sẵn, người dùng cần làm gì?", "image": "", "options": ["Đặt máy tính lại gần nguồn sáng.", "Xóa bớt phần mềm diệt virus.", "Khởi động lại hệ điều hành nhiều lần.", "Lắp thêm một bảng mạch mở rộng."], "correct": 3, "explanation": ""}, {"id": 119, "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "lesson": "Đề 5", "type": "single", "question": "Tên gọi Modem là viết tắt của hai từ tiếng Anh nào?", "image": "", "options": ["Monitor và Demand.", "Module và Demo.", "Modern và Empire.", "Modulation và Demodulation."], "correct": 3, "explanation": ""}, {"id": 120, "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "lesson": "Đề 5", "type": "single", "question": "Việc cửa ra vào siêu thị tự động mở khi có người tới gần có được coi là ứng dụng AI không?", "image": "", "options": ["Có, vì nó tự động ra quyết định.", "Không, vì nó thuộc hệ chuyên gia.", "Không, đây chỉ là tự động hoá đơn thuần.", "Có, vì nó nhận diện được con người."], "correct": 2, "explanation": ""}, {"id": 121, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Giao tiếp trong không gian mạng có nhiều ưu điểm. Tiết kiệm thời gian và chi phí. So với giao tiếp trực tiếp, giao tiếp trực tuyến giúp tiết kiệm thời gian và chi phí di chuyển. Tuy nhiên giao tiếp trong không gian mạng cũng có nhiều nhược điểm. Thiếu tín hiệu phi ngôn ngữ, có thể thiếu tín hiệu phi ngôn ngữ như nét mặt, ngôn ngữ cơ thể và biểu cảm giọng nói.\"", "image": "", "statements": [{"id": "a", "text": "Việc sử dụng giao tiếp trực tuyến thường làm tăng đáng kể chi phí và thời gian di chuyển của người tham gia.", "correct": false}, {"id": "b", "text": "Giao tiếp trong không gian mạng là một môi trường tuyệt đối an toàn và không tồn tại bất kỳ nguy cơ nào về quyền riêng tư.", "correct": false}, {"id": "c", "text": "Một hạn chế lớn của việc nhắn tin hay gửi thư điện tử là không truyền tải được nét mặt và biểu cảm cơ thể.", "correct": true}, {"id": "d", "text": "Hội nghị truyền hình là giải pháp hữu hiệu để giảm bớt chi phí ăn ở và nhu cầu đi lại trong công việc.", "correct": true}], "explanation": ""}, {"id": 122, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Máy tính cung cấp dịch vụ in sẽ nhận yêu cầu gửi đến từ các máy tính khác trong mạng, xếp thành hàng đợi. Khi máy in sẵn sàng, máy tính cung cấp dịch vụ in sẽ điều khiển máy in in lần lượt các tài liệu được gửi tới. Như vậy, việc chia sẻ máy in thực chất là biến máy tính có máy in đó thành một máy chủ cung cấp dịch vụ in (Print Server).\"", "image": "", "statements": [{"id": "a", "text": "Máy tính cung cấp dịch vụ in đóng vai trò xử lý các tài liệu được yêu cầu in thành một hàng đợi để tiến hành in lần lượt.", "correct": true}, {"id": "b", "text": "Máy tính có gắn máy in chỉ có thể tiếp nhận và xử lý yêu cầu in từ một máy tính duy nhất trên mạng LAN tại một thời điểm nhất định.", "correct": false}, {"id": "c", "text": "Về bản chất, tính năng chia sẻ máy in chính là tạo ra một máy chủ cung cấp dịch vụ in (Print Server) để quản lý luồng tài liệu.", "correct": true}, {"id": "d", "text": "Quá trình thao tác chia sẻ máy in trên mạng sẽ trực tiếp cấu hình chiếc máy in phần cứng đó trở thành một máy chủ web chuyên biệt.", "correct": false}], "explanation": ""}, {"id": 123, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Thiếu kết nối quan hệ cá nhân chặt chẽ: Trong không gian mạng, người sử dụng có thể dễ dàng giấu mặt, tạo ra các bản sao không đầy đủ của bản thân hoặc giả mạo thông tin, làm cho người khác khó đánh giá được tính chân thật của thông tin và sự thật về người đối diện. Ví dụ, thông tin cá nhân của một tài khoản cụ thể trên mạng xã hội có thể chỉ là các thông tin bịa đặt.\"", "image": "", "statements": [{"id": "a", "text": "Trải nghiệm giao tiếp trong không gian mạng luôn đem lại chất lượng kết nối sâu sắc và hiệu quả hơn giao tiếp ngoài đời thực.", "correct": false}, {"id": "b", "text": "Tất cả các thông tin cá nhân được hiển thị công khai trên một tài khoản mạng xã hội luôn luôn là sự thật.", "correct": false}, {"id": "c", "text": "Việc không thể xác định tính chân thật của người đối diện gây khó khăn lớn trong việc xây dựng lòng tin.", "correct": true}, {"id": "d", "text": "Môi trường ẩn danh trên mạng tạo điều kiện dễ dàng cho việc giấu mặt và làm giả thông tin cá nhân.", "correct": true}], "explanation": ""}, {"id": 124, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Ví dụ: Giao thức Ethernet về truyền tin trong mạng cục bộ. Quy định về mã kiểm tra. Giữa hai máy tính, không thể truyền một lượng tin dài không giới hạn trong một khoảng thời gian không định trước vì có thể làm quá tải máy nhận.\"", "image": "", "statements": [{"id": "a", "text": "Mã kiểm tra đính kèm dữ liệu có tác dụng giúp máy nhận phát hiện xem dữ liệu có bị lỗi trong quá trình truyền hay không.", "correct": true}, {"id": "b", "text": "Truyền dữ liệu thành một khối dài vô tận là cách hiệu quả nhất để tiết kiệm thời gian truyền tin.", "correct": false}, {"id": "c", "text": "Nếu phát hiện có lỗi truyền thông qua mã kiểm tra, máy nhận có thể tự động sửa lỗi mà không cần máy gửi can thiệp.", "correct": false}, {"id": "d", "text": "Việc truyền dữ liệu thực chất được thực hiện theo từng gói nhỏ có độ dài được xác định trước.", "correct": true}], "explanation": ""}, {"id": 125, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Khi tham gia một cuộc thảo luận trên mạng xã hội, hãy đọc kĩ bài viết, không chia sẻ thông tin trao đổi riêng giữa hai người với một bên thứ ba khi chưa được phép.\"", "image": "", "statements": [{"id": "a", "text": "Chụp màn hình đoạn tin nhắn tâm sự riêng tư của một người bạn và gửi vào nhóm chat khác để bàn tán là hành vi sai trái.", "correct": true}, {"id": "b", "text": "Trong các cuộc gọi video trực tuyến tại nhà, việc ăn mặc luộm thuộm được chấp nhận vì người khác chỉ nhìn thấy bạn qua màn hình.", "correct": false}, {"id": "c", "text": "Để đưa ra ý kiến phản biện sắc bén trên mạng xã hội, ta không cần đọc hết bài viết mà chỉ cần dựa vào tiêu đề.", "correct": false}, {"id": "d", "text": "Kiểm tra tính chính xác của thông tin trước khi nhấn nút \"Share\" giúp ngăn ngừa việc làm tổn hại đến danh tiếng của người khác.", "correct": true}], "explanation": ""}, {"id": 126, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\n\"Mạng công cộng thường được thiết lập ở những địa điểm công cộng như nhà ga... với mục đích hạn chế nguy cơ lộ thông tin. Mạng riêng được hiểu là mạng của nhóm người dùng có độ tin cậy cao hơn...\"", "image": "", "statements": [{"id": "a", "text": "Khi sử dụng Wi-Fi ở quán cà phê, người dùng nên cài đặt thành mạng riêng (Private network) để bảo mật tốt hơn.", "correct": false}, {"id": "b", "text": "Mạng riêng (Private network) được ưu tiên sử dụng khi cần chia sẻ tài nguyên giữa các thiết bị do mức độ tin cậy cao.", "correct": true}, {"id": "c", "text": "Các phiên bản Windows mới thường không quan tâm đến an ninh mạng để dễ dàng trong việc chia sẻ.", "correct": false}, {"id": "d", "text": "Thiết lập mạng công cộng (Public network) nhằm phục vụ mục đích hạn chế các nguy cơ lộ thông tin cá nhân.", "correct": true}], "explanation": ""}, {"id": 127, "section": "Phần II. Trắc nghiệm đúng/sai", "lesson": "Phần II - Đúng/Sai", "type": "truefalse", "question": "Đọc ngữ liệu và xét các nhận định sau.\nGoogle dịch là một dịch vụ dịch thuật miễn phí do Google phát triển vào tháng 4 năm 2006. Hiện tại, công nghệ nhận dạng chữ viết tay được sử dụng rộng rãi. Một trong số những ứng dụng thú vị của AI là các 'Trợ lí ảo'...", "image": "", "statements": [{"id": "a", "text": "Google dịch có thể nhận ra các từ trong hình ảnh và phiên dịch tức thời.", "correct": true}, {"id": "b", "text": "Các trợ lí ảo có thể trò chuyện và tìm kiếm thông tin bằng tiếng nói của người dùng.", "correct": true}, {"id": "c", "text": "Ứng dụng nhận dạng khuôn mặt giúp chuyển đổi hình ảnh chữ viết tay thành dữ liệu văn bản.", "correct": false}, {"id": "d", "text": "Trợ lí ảo Bixby là sản phẩm được phát triển bởi Samsung.", "correct": true}], "explanation": ""}, {"id": 128, "section": "Phần II. Trắc ng tham gia tranh luận phải chia sẻ và chấp nhận cùng một quan điểm với số đông.", "correct": false}, {"id": "b", "text": "Lan truyền bí mật cá nhân của bạn bè lên nhóm chat khi chưa xin phép là hành vi vi phạm nguyên tắc \"Tôn trọng\".", "correct": true}, {"id": "c", "text": "Sử dụng từ ngữ châm chọc trong bình luận là cách thể hiện sự thân thiết và vẫn đảm bảo tính lịch sự.", "correct": false}, {"id": "d", "text": "Việc liên tục gửi các đường dẫn quảng cáo vào nhóm làm việc chung là hành vi cần tránh để giữ lịch sự.", "correct": true}], "explanation": ""}];

// ---------- trạng thái ----------
const S = { name: '', history: [], notes: {}, flags: {}, session: null };
const H = { mode: 'practice', shuffle: true, les: null, types: new Set(['single', 'truefalse', 'short']) };
let Q = null, view = 'home', rev = null, rvF = 'all', palOpen = false;
let lbF = 'latest', lbL = 'Tổng hợp', lbData = [], lbSrc = '', lbTimer = null, lbWarned = false;
let last = 0, tmr = null, tt = null, noteT = null;

const $ = s => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60, p = x => (x < 10 ? '0' : '') + x; return (h ? h + ':' : '') + p(m) + ':' + p(r); }
function shuf(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function toast(h, c) { const t = $('#toast'); t.innerHTML = h; t.className = 'show ' + (c || ''); clearTimeout(tt); tt = setTimeout(() => { t.className = ''; }, 2600); }

// ---------- bẫy lỗi hiển thị ----------
function crash(msg) {
  const d = document.createElement('div'); d.className = 'crash';
  d.innerHTML = '<h3>⚠️ Đã xảy ra lỗi</h3><pre>' + esc(msg) + '</pre><button id="rcv">Khôi phục ứng dụng</button>';
  document.body.appendChild(d);
  d.querySelector('#rcv').onclick = () => { d.remove(); last = 0; clearInterval(tmr); Q = null; view = 'home'; try { render(); } catch (e) { location.reload(); } };
}
window.addEventListener('error', e => { if (e.message) crash(e.message + (e.lineno ? ' (dòng ' + e.lineno + ')' : '')); });
window.addEventListener('unhandledrejection', e => { crash(String(e.reason && e.reason.message || e.reason)); });

// ---------- StorageEngine: IndexedDB + RAM, fallback LocalStorage ----------
const SE = (function () {
  let db = null;
  function openDb() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) { res(); return; }
        const rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
        rq.onsuccess = () => { db = rq.result; res(); };
        rq.onerror = () => res(); rq.onblocked = () => res();
      } catch (e) { res(); }
    });
  }
  function get(k) {
    return new Promise(res => {
      if (db) { try { const r = db.transaction('kv', 'readonly').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); return; } catch (e) { } }
      res(lsGet('nht_' + k, undefined));
    });
  }
  function set(k, v) { if (db) { try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); return; } catch (e) { } } lsSet('nht_' + k, v); }
  function del(k) { if (db) { try { db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { } } try { localStorage.removeItem('nht_' + k); } catch (e) { } }
  return { openDb, get, set, del };
})();

// ---------- dữ liệu dẫn xuất ----------
const BY = {}; examData.forEach(q => { BY[q.id] = q; });
const LES = []; examData.forEach(q => { let l = LES.find(x => x.name === q.lesson); if (!l) { l = { name: q.lesson, c: { single: 0, truefalse: 0, short: 0 } }; LES.push(l); } l.c[q.type]++; });
const TYPES = [['single', 'Trắc nghiệm nhiều lựa chọn'], ['truefalse', 'Trắc nghiệm Đúng/Sai'], ['short', 'Trả lời ngắn']];
const TC = { single: 0, truefalse: 0, short: 0 }; examData.forEach(q => { TC[q.type]++; });
H.les = new Set(LES.map(l => l.name));
const OKMSG = '✅ <b>Làm tốt lắm</b> - Hãy giữ vững phong độ. Tiến lên';
const BADMSG = '🔄 <b>Không đúng!</b> - Làm lại hoặc bạn có thể bỏ qua';

// ---------- chấm điểm ----------
function normNum(v) { const t = String(v == null ? '' : v).trim().replace(/\s+/g, '').replace(/,/g, '.'); return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(t) ? String(Number(t)) : t.toLowerCase(); }
function grade(q, a) {
  if (q.type === 'single') return a === q.correct ? 1 : 0;
  if (q.type === 'truefalse') { if (!Array.isArray(a)) return 0; let n = 0; q.statements.forEach((s, i) => { if (a[i] === s.correct) n++; }); return [0, 0.1, 0.25, 0.5, 1][n]; }
  return normNum(a) !== '' && normNum(a) === normNum(q.correct) ? 1 : 0;
}
function isAns(q, a) {
  if (q.type === 'single') return a != null;
  if (q.type === 'truefalse') return Array.isArray(a) && a.length === q.statements.length && a.every(x => x != null);
  return String(a == null ? '' : a).trim() !== '';
}
function stats() { const m = {}; S.history.forEach(h => (h.items || []).forEach(x => { const r = m[x.q] || (m[x.q] = { t: 0, w: 0 }); r.t++; if (x.s < 1) r.w++; })); return m; }
function wrongIds(st) { return Object.keys(st).filter(k => st[k].w > 0 && BY[k]).sort((a, b) => (st[b].w / st[b].t) - (st[a].w / st[a].t) || st[b].w - st[a].w).map(Number); }

// ---------- phiên làm bài ----------
function permOf(q) { const n = q.type === 'single' ? q.options.length : q.type === 'truefalse' ? q.statements.length : 0; const a = []; for (let i = 0; i < n; i++) a.push(i); return H.shuffle ? shuf(a) : a; }
function orderList(list) { if (!H.shuffle) return list.slice(); const g = { single: [], truefalse: [], short: [] }; list.forEach(q => g[q.type].push(q)); return [].concat(shuf(g.single), shuf(g.truefalse), shuf(g.short)); }
function startList(list, title, kind, mode, lesson) {
  if (!list.length) { toast('Không có câu hỏi phù hợp'); return; }
  if (S.session && !confirm('Đang có bài làm dở. Bắt đầu bài mới sẽ bỏ bài dở. Tiếp tục?')) return;
  const items = orderList(list).map(q => ({ id: q.id, p: permOf(q) }));
  Q = { v: 1, mode, kind, title, lesson: lesson || 'Tổng hợp', items, pos: 0, ans: {}, chk: {}, res: {}, fa: {}, cut: {}, elapsedMs: 0, limitMs: mode === 'exam' ? Math.ceil(items.length * 1.2) * 60000 : 0, startTs: Date.now() };
  S.session = Q; view = 'quiz'; palOpen = false; saveQ(); startClock(); render(); window.scrollTo(0, 0);
}
function startNormal() {
  const l = examData.filter(q => H.les.has(q.lesson) && H.types.has(q.type)); const ls = LES.filter(x => H.les.has(x.name)).map(x => x.name);
  startList(l, ls.length === LES.length ? 'Tổng hợp' : ls.join(', '), 'normal', H.mode, ls.length === 1 ? ls[0] : 'Tổng hợp');
}
function saveQ() {
  if (!Q) return; tickNow(); Q.savedAt = Date.now(); S.session = Q;
  try { localStorage.setItem('nht_session_ls', JSON.stringify(Q)); } catch (e) { }
  SE.set('session', Q);
}
function tickNow() { if (!Q || !last) return; const n = performance.now(); Q.elapsedMs += n - last; last = n; }
function startClock() { last = performance.now(); clearInterval(tmr); tmr = setInterval(onTick, 500); }
function stopClock() { tickNow(); last = 0; clearInterval(tmr); tmr = null; }
function onTick() {
  if (!Q || view !== 'quiz' || !last) return; tickNow(); updTimer();
  if (Q.mode === 'exam' && Q.elapsedMs >= Q.limitMs) { toast('⏰ Hết giờ - tự động nộp bài'); finish(); }
}
function updTimer() { const e = $('#tm'); if (e && Q) e.textContent = Q.mode === 'exam' ? '⏳ ' + fmt(Q.limitMs - Q.elapsedMs) : '⏱ ' + fmt(Q.elapsedMs); }
function onHide() { if (Q) { tickNow(); last = 0; saveQ(); } }
function onShow() { if (Q && view === 'quiz' && !last) last = performance.now(); }
function resume() { if (!S.session) return; Q = S.session; view = 'quiz'; palOpen = false; startClock(); render(); window.scrollTo(0, 0); }
function exitQuiz() { stopClock(); saveQ(); Q = null; view = 'home'; render(); toast('Đã lưu tiến trình - bấm Tiếp tục để làm tiếp'); }
function discard() { if (!confirm('Bỏ bài đang làm dở?')) return; S.session = null; SE.del('session'); try { localStorage.removeItem('nht_session_ls'); } catch (e) { } render(); }
function goPos(i) { if (!Q) return; Q.pos = Math.max(0, Math.min(Q.items.length - 1, i)); palOpen = false; clearPad(); saveQ(); render(); window.scrollTo(0, 0); }
function submit() {
  const ex = Q.mode === 'exam';
  const un = Q.items.filter(it => ex ? !isAns(BY[it.id], Q.ans[it.id]) : Q.chk[it.id] === undefined).length;

function clearPad() { const c = $('#pad'); if (c && c.width) c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function togglePad() {
  padOn = !padOn; $('#padw').style.display = padOn ? 'block' : 'none'; $('#padt').style.display = padOn ? 'flex' : 'none';
  if (padOn) { const c = $('#pad'); if (c.width !== window.innerWidth || c.height !== window.innerHeight) { c.width = window.innerWidth; c.height = window.innerHeight; } }
}
function padInit() {
  const c = $('#pad'), ctx = c.getContext('2d');
  function pt(e) { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  c.addEventListener('pointerdown', e => { padDraw = true; const p = pt(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); try { c.setPointerCapture(e.pointerId); } catch (x) { } });
  c.addEventListener('pointermove', e => {
    if (!padDraw) return; const p = pt(e); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = padErase ? 'destination-out' : 'source-over'; ctx.strokeStyle = padCol; ctx.lineWidth = padErase ? 26 : 3; ctx.lineTo(p[0], p[1]); ctx.stroke();
  });
  const up = () => { padDraw = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  $('#padt').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const v = b.dataset.c;
    if (v === 'close') togglePad(); else if (v === 'clear') clearPad(); else if (v === 'erase') padErase = true; else { padErase = false; padCol = v; }
  });
}

// ---------- sự kiện (ủy quyền, gắn một lần) ----------
function act(a, t, e) {
  const id = Q && Q.items[Q.pos] ? Q.items[Q.pos].id : 0, q = id ? BY[id] : null;
  const lock = Q && Q.mode !== 'exam' && Q.chk[id] !== undefined;
  switch (a) {
    case 'tab': if (view === 'quiz') return; go(t.dataset.v); break;
    case 'mode': H.mode = t.dataset.v; render(); break;
    case 'start': startNormal(); break;
    case 'resume': resume(); break;
    case 'discard': discard(); break;
    case 'quick': {
      const v = t.dataset.v; let ids;
      if (v === 'wrong') ids = wrongIds(stats()); else ids = Object.keys(S.flags).filter(k => S.flags[k] === (v === 'star' ? 1 : 2) && BY[k]).map(Number);
      startList(ids.map(i => BY[i]), v === 'wrong' ? 'Các câu hay sai' : v === 'star' ? 'Câu hay/Cần nhớ' : 'Câu phân vân', 'quick', H.mode, 'Tổng hợp'); break;
    }
    case 'export': exportJ(); break;
    case 'exit': exitQuiz(); break;
    case 'pad': togglePad(); break;
    case 'pal': if (e.target.closest('[data-stop]') && !e.target.closest('button')) return; palOpen = !palOpen; render(); break;
    case 'jump': goPos(+t.dataset.i); break;
    case 'prev': goPos(Q.pos - 1); break;
    case 'next': goPos(Q.pos + 1); break;
    case 'main': mainAct(); break;
    case 'submit': submit(); break;
    case 'flag': { const v = +t.dataset.v; if (S.flags[id] === v) delete S.flags[id]; else S.flags[id] = v; SE.set('flags', S.flags); render(); break; }
    case 'pick': if (!Q || lock) return; Q.ans[id] = +t.dataset.i; saveQ(); render(); break;
    case 'cut': { if (!Q || lock) return; const i = +t.dataset.i, c = Q.cut[id] || (Q.cut[id] = []), k = c.indexOf(i); if (k >= 0) c.splice(k, 1); else c.push(i); saveQ(); render(); break; }
    case 'tf': { if (!Q || lock) return; const arr = Q.ans[id] || (Q.ans[id] = new Array(q.statements.length).fill(null)); arr[+t.dataset.i] = t.dataset.v === '1'; saveQ(); render(); break; }
    case 'review': rvF = 'all'; view = 'review'; render(); window.scrollTo(0, 0); break;
    case 'rvf': rvF = t.dataset.v; render(); break;
    case 'retryw': { const ids = rev.items.filter(x => x.s < 1).map(x => x.q); startList(ids.map(i => BY[i]), 'Luyện lại câu sai', 'retry', 'practice', 'Tổng hợp'); break; }
    case 'hview': rev = Object.assign({}, S.history[+t.dataset.i], { fromHist: true }); rvF = 'all'; view = 'review'; render(); window.scrollTo(0, 0); break;
    case 'hdel': if (confirm('Xóa lượt làm bài này?')) { S.history.splice(+t.dataset.i, 1); SE.set('history', S.history); render(); } break;
    case 'lbf': lbF = t.dataset.v; render(); break;
    case 'lbl': lbL = t.dataset.v; render(); break;
  }
}
function onChange(e) {
  const t = e.target;
  if (t.id === 'imp') { importJ(t.files && t.files[0]); t.value = ''; return; }
  const k = t.dataset && t.dataset.k; if (!k) return;
  if (k === 'shuf') H.shuffle = t.checked;
  else { const set = k === 'les' ? H.les : H.types, v = t.dataset.v; if (t.checked) set.add(v); else set.delete(v); }
  render();
}
function onInput(e) {
  const t = e.target;
  if (t.id === 'sa' && Q) { Q.ans[Q.items[Q.pos].id] = t.value; saveQ(); refreshBar(); }
  else if (t.id === 'nm') { S.name = t.value.trim(); SE.set('name', S.name); }
  else if (t.dataset && t.dataset.note) { S.notes[t.dataset.note] = t.value; clearTimeout(noteT); noteT = setTimeout(() => SE.set('notes', S.notes), 400); }
}
function onKey(e) {
  if (view !== 'quiz' || !Q || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA'), k = e.key;
  if (k === 'Enter') { if (tg && tg.tagName === 'TEXTAREA') return; e.preventDefault(); mainAct(); return; }
  if (typing) return;
  if (k === ' ') { e.preventDefault(); mainAct(); return; }
  if (k === 'ArrowLeft') { goPos(Q.pos - 1); return; }
  if (k === 'ArrowRight') { goPos(Q.pos + 1); return; }
  const it = Q.items[Q.pos], q = BY[it.id];
  if (q.type === 'single' && (Q.mode === 'exam' || Q.chk[it.id] === undefined)) {
    const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[String(k).toLowerCase()];
    if (m !== undefined && m < it.p.length) { Q.ans[it.id] = it.p[m]; saveQ(); render(); }
  }
}

// ---------- khởi động ----------
async function init() {
  const app = $('#app');
  app.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; act(t.dataset.act, t, e); });
  app.addEventListener('change', onChange); app.addEventListener('input', onInput);
  app.addEventListener('contextmenu', e => { const o = e.target.closest('.opt'); if (o && Q && view === 'quiz' && (Q.mode === 'exam' || Q.chk[Q.items[Q.pos].id] === undefined)) { e.preventDefault(); const x = o.querySelector('.x'); if (x) x.click(); } });
  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', () => { if (document.hidden) onHide(); else onShow(); });
  window.addEventListener('pagehide', onHide); window.addEventListener('beforeunload', onHide);
  padInit();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  await SE.openDb();
  for (const k of ['history', 'notes', 'flags', 'name', 'session']) { const v = await SE.get(k); if (v !== undefined && v !== null) S[k] = v; }
  try { const s = lsGet('nht_session_ls', null); if (s && s.items && (!S.session || (s.savedAt || 0) > (S.session.savedAt || 0))) S.session = s; } catch (e) { }
  if (S.session && !(S.session.items && S.session.items.length && S.session.items.every(it => BY[it.id]))) S.session = null;
  if (!Array.isArray(S.history)) S.history = [];
  render();
  if (S.session) setTimeout(() => { let ok = false; try { ok = confirm('Bạn có bài đang làm dở (Câu ' + (S.session.pos + 1) + '/' + S.session.items.length + '). Làm tiếp?'); } catch (e) { } if (ok) resume(); }, 80);
}
function boot() { init().catch(e => crash(String(e && e.message || e))); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
